[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-event-renderer"
version = "0.1.0"
description = "ALICE O2 event inspection and individual Blender rendering"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "numpy>=2,<3", "uproot>=5.5,<6", "ijson>=3.3,<4", "psutil>=6", "matplotlib>=3.9,<4", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alice-renderer = "alice_renderer.app:main"
alice-render = "alice_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alice_renderer = ["blender/*.py", "palette_names.json", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
